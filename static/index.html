<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>Family Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/calendar.css">
  <link rel="stylesheet" href="/css/weather.css">
  <link rel="stylesheet" href="/css/alerts.css">
  <link rel="stylesheet" href="/css/background.css">
</head>
<body>

  <!-- Ambient background: a living illustrated scene behind the whole grid.
       Panels stay opaque, so it shows through the padding frame and the gaps
       between panels. Layered so any (phase x weather x season) just stacks;
       background.js sets phase-/weather-/season- classes and the celestial
       CSS vars. Draws everything locally — never fetches an external asset. -->
  <div id="scene" class="scene phase-night season-summer weather-clear" aria-hidden="true">
    <div class="sky"></div>
    <div class="stars"></div>
    <div class="sun"></div>
    <div class="moon"></div>

    <!-- Fixed silhouette: mountain, house, trees, shrubs, ground. Re-skinned
         by season via CSS vars, re-lit by phase (window glows at night). -->
    <svg class="landscape" viewBox="0 0 1920 760" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <!-- Mountain on the horizon -->
      <polygon class="lz-mountain" points="-40,520 360,250 620,400 900,180 1200,470 1500,300 1720,470 1960,360 1960,760 -40,760"/>
      <polygon class="lz-snow lz-cap" points="820,240 900,180 985,250 940,262 900,238 862,262"/>
      <polygon class="lz-snow lz-cap" points="300,300 360,250 430,318 392,300 360,270 336,300"/>

      <!-- Ground plane -->
      <rect class="lz-ground" x="-40" y="560" width="2000" height="240"/>
      <rect class="lz-snow lz-ground-snow" x="-40" y="560" width="2000" height="240"/>

      <!-- House -->
      <g class="lz-house-group">
        <rect class="lz-house" x="1360" y="470" width="150" height="110"/>
        <polygon class="lz-roof" points="1345,472 1435,405 1525,472"/>
        <polygon class="lz-snow lz-roof-snow" points="1345,472 1435,405 1525,472 1495,472 1435,428 1375,472"/>
        <rect class="lz-window" x="1400" y="500" width="34" height="34"/>
        <rect class="lz-door" x="1458" y="512" width="30" height="68"/>
      </g>

      <!-- Trees (sway; foliage re-skinned by season) -->
      <g class="lz-tree" style="transform-origin:230px 580px">
        <rect class="lz-trunk" x="218" y="470" width="24" height="112"/>
        <ellipse class="lz-canopy" cx="230" cy="440" rx="86" ry="78"/>
        <ellipse class="lz-snow lz-canopy-snow" cx="230" cy="404" rx="70" ry="34"/>
        <g class="lz-blossom"><circle cx="196" cy="428" r="6"/><circle cx="250" cy="410" r="6"/><circle cx="230" cy="462" r="6"/><circle cx="272" cy="452" r="6"/></g>
      </g>
      <g class="lz-tree" style="transform-origin:560px 590px">
        <rect class="lz-trunk" x="551" y="486" width="18" height="106"/>
        <ellipse class="lz-canopy" cx="560" cy="462" rx="64" ry="58"/>
        <ellipse class="lz-snow lz-canopy-snow" cx="560" cy="436" rx="52" ry="26"/>
        <g class="lz-blossom"><circle cx="534" cy="452" r="5"/><circle cx="580" cy="440" r="5"/><circle cx="566" cy="482" r="5"/></g>
      </g>
      <g class="lz-tree" style="transform-origin:1080px 585px">
        <rect class="lz-trunk" x="1070" y="474" width="22" height="112"/>
        <ellipse class="lz-canopy" cx="1081" cy="446" rx="78" ry="70"/>
        <ellipse class="lz-snow lz-canopy-snow" cx="1081" cy="414" rx="64" ry="30"/>
        <g class="lz-blossom"><circle cx="1050" cy="436" r="6"/><circle cx="1104" cy="420" r="6"/><circle cx="1090" cy="470" r="6"/><circle cx="1044" cy="466" r="6"/></g>
      </g>

      <!-- Shrubs -->
      <ellipse class="lz-shrub" cx="770" cy="590" rx="58" ry="34"/>
      <ellipse class="lz-shrub" cx="1240" cy="596" rx="70" ry="38"/>
      <ellipse class="lz-shrub" cx="1650" cy="592" rx="52" ry="30"/>

      <!-- Fallen leaves (autumn) -->
      <g class="lz-fallen">
        <circle cx="330" cy="612" r="5"/><circle cx="420" cy="632" r="5"/>
        <circle cx="640" cy="620" r="5"/><circle cx="880" cy="640" r="5"/>
        <circle cx="1180" cy="624" r="5"/><circle cx="1520" cy="636" r="5"/>
        <circle cx="1700" cy="616" r="5"/>
      </g>
    </svg>

    <!-- Optional pre-rendered backdrop. When a matching /img/bg/<season>-<phase>.jpg
         exists, background.js crossfades it in over the SVG scene above; when it
         doesn't (not generated yet), these stay transparent and the SVG shows.
         Sits below the weather overlays, so rain/snow/clouds/lightning still
         animate on top of the image. -->
    <div class="scene-photo">
      <div class="scene-photo-layer" data-layer="a"></div>
      <div class="scene-photo-layer" data-layer="b"></div>
    </div>

    <!-- Weather overlays (shown per weather- class) -->
    <div class="wx-clouds">
      <div class="wx-cloud c1"></div>
      <div class="wx-cloud c2"></div>
      <div class="wx-cloud c3"></div>
    </div>
    <div class="wx-fog"></div>
    <div class="wx-rain"></div>
    <div class="wx-snow"></div>
    <div class="wx-wind"></div>
    <div class="wx-lightning"></div>
    <div class="scene-scrim"></div>
  </div>

  <div class="dashboard">

    <section class="photos" aria-label="Photo slideshow">
      <div id="photo-stage" class="photo-stage">
        <figure class="photo-layer is-visible" data-layer="a">
          <div class="photo-backdrop"></div>
          <img class="photo-image" alt="">
        </figure>
        <figure class="photo-layer" data-layer="b">
          <div class="photo-backdrop"></div>
          <img class="photo-image" alt="">
        </figure>
      </div>
      <p id="photo-empty" class="photo-empty" hidden>
        Drop images into the <code>photos/</code> folder
      </p>

      <!-- Clock + date overlaid on the photos: one compact line, transparent
           with a scrim so it stays legible over bright photos. -->
      <div class="clock-overlay" aria-label="Time and date">
        <span id="time" class="time">--:--</span><span id="meridiem" class="meridiem"></span>
        <span id="date" class="date"></span>
      </div>

      <!-- Alerts: a single shiny pill along the bottom of the photo panel that
           rotates through the active alerts one at a time. Hidden unless it is
           the brief in-view window AND there is something to show. Never
           affects the dashboard layout. -->
      <div id="alerts-overlay" class="alerts-overlay" aria-live="polite" hidden></div>
    </section>

    <section class="calendar" aria-label="Month calendar">
      <div class="calendar-head">
        <h2 id="month-label" class="panel-title">&nbsp;</h2>
        <div id="legend" class="legend"></div>
      </div>
      <div id="weekdays" class="weekdays"></div>
      <div id="month-grid" class="month-grid"></div>
    </section>

    <section class="agenda" aria-label="Next events">
      <ol id="agenda-list" class="agenda-list"></ol>
    </section>

    <!-- One-line, non-scrolling strip of upcoming keyword highlights. -->
    <section class="ticker" aria-label="Upcoming highlights">
      <span class="ticker-lead">UPCOMING</span>
      <div id="ticker-list" class="ticker-list"></div>
    </section>

    <section class="weather" aria-label="Weather">
      <div class="weather-now">
        <svg class="wx-icon wx-icon-lg"><use id="now-icon" href="#wx-clear"></use></svg>
        <div class="now-block">
          <div class="now-headline">
            <span id="now-temp" class="now-temp">--&deg;</span><span id="now-temp-c" class="now-temp-c"></span>
            <span id="now-condition" class="now-condition"></span>
          </div>
          <div id="now-l2" class="now-line"></div>
          <div id="now-l3" class="now-line"></div>
          <div id="now-l4" class="now-line"></div>
        </div>
      </div>
      <ol id="forecast" class="forecast"></ol>
    </section>

  </div>

  <!-- Subtle stale-data indicator: a quiet dot in the corner when a feed's
       cache has gone stale (> ~2x its refresh interval). Hidden when all fresh. -->
  <div id="stale-dot" class="stale-dot" aria-hidden="true" hidden></div>

  <!-- Weather glyphs. Drawn locally so the page never loads an NWS image. -->
  <svg class="wx-defs" aria-hidden="true" focusable="false">
    <defs>
      <g id="g-cloud">
        <path d="M18 42h26a9 9 0 0 0 .8-18 14 14 0 0 0-26.4-3A9.5 9.5 0 0 0 18 42Z"/>
      </g>

      <symbol id="wx-clear" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="12"/>
        <g class="wx-rays">
          <path d="M32 4v9M32 51v9M4 32h9M51 32h9M12 12l6.5 6.5M45.5 45.5 52 52M52 12l-6.5 6.5M18.5 45.5 12 52"/>
        </g>
      </symbol>

      <symbol id="wx-clear-night" viewBox="0 0 64 64">
        <path d="M44 38A17 17 0 0 1 26 20a17 17 0 0 0 4 33 17 17 0 0 0 16-11 17 17 0 0 1-2 -4Z"/>
      </symbol>

      <symbol id="wx-partly" viewBox="0 0 64 64">
        <circle cx="24" cy="22" r="9"/>
        <path class="wx-rays" d="M24 4v6M24 34v3M6 22h6M36 22h4M11 9l4 4M37 9l-4 4"/>
        <use href="#g-cloud" x="6" y="8"/>
      </symbol>

      <symbol id="wx-partly-night" viewBox="0 0 64 64">
        <path d="M34 26a12 12 0 0 1-12-12 12 12 0 1 0 15 15 12 12 0 0 1-3-3Z"/>
        <use href="#g-cloud" x="6" y="8"/>
      </symbol>

      <symbol id="wx-cloudy" viewBox="0 0 64 64">
        <use href="#g-cloud" x="1" y="6"/>
      </symbol>

      <symbol id="wx-rain" viewBox="0 0 64 64">
        <use href="#g-cloud" x="1" y="-1"/>
        <path class="wx-drops" d="M21 48l-3 9M33 48l-3 9M45 48l-3 9"/>
      </symbol>

      <symbol id="wx-thunder" viewBox="0 0 64 64">
        <use href="#g-cloud" x="1" y="-3"/>
        <path class="wx-bolt" d="M34 42l-11 13h8l-3 11 12-14h-8l2-10Z"/>
      </symbol>

      <symbol id="wx-snow" viewBox="0 0 64 64">
        <use href="#g-cloud" x="1" y="-1"/>
        <path class="wx-drops" d="M20 50v8M16.5 52l7 4M23.5 52l-7 4M40 50v8M36.5 52l7 4M43.5 52l-7 4"/>
      </symbol>

      <symbol id="wx-sleet" viewBox="0 0 64 64">
        <use href="#g-cloud" x="1" y="-1"/>
        <path class="wx-drops" d="M20 48l-3 9M42 50v8M38.5 52l7 4M45.5 52l-7 4M31 48l-3 9"/>
      </symbol>

      <symbol id="wx-fog" viewBox="0 0 64 64">
        <use href="#g-cloud" x="1" y="-6"/>
        <path class="wx-drops" d="M12 46h40M18 54h34"/>
      </symbol>

      <symbol id="wx-wind" viewBox="0 0 64 64">
        <path class="wx-drops" d="M6 22h30a7 7 0 1 0-7-7M6 34h40a7 7 0 1 1-7 7M6 46h24"/>
      </symbol>

      <symbol id="wx-hot" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="13"/>
        <g class="wx-rays">
          <path d="M32 5v8M32 51v8M5 32h8M51 32h8M13 13l5 5M46 46l5 5M51 13l-5 5M18 46l-5 5"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
